<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvasmith — vanilla demo (no React, no build)</title>
<!-- fabric is the only runtime dependency, and the ONLY script tag: the editor itself loads as
     native ES modules straight from src/. This page IS the "bring your own UI" story. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
  :root { --bg:#141417; --panel:#1b1b20; --line:#2a2a31; --ink:#eceae4; --dim:#9a978f; --accent:#d4ff45; }
  * { box-sizing:border-box } html,body { margin:0; height:100% }
  body { background:var(--bg); color:var(--ink); font:13px/1.5 system-ui,sans-serif; display:grid;
         grid-template-rows:46px 1fr; height:100vh }
  header { display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line) }
  header b { color:var(--accent) } header .sp { flex:1 }
  main { display:grid; grid-template-columns:150px 1fr 210px; min-height:0 }
  nav, aside { background:var(--panel); overflow-y:auto; padding:8px }
  nav { border-right:1px solid var(--line) } aside { border-left:1px solid var(--line) }
  #stage { display:grid; place-items:center; overflow:hidden;
           background:repeating-conic-gradient(#151519 0 25%,#101014 0 50%) 0 0/22px 22px }
  .grp { font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:10px 4px 4px }
  button { all:unset; cursor:pointer; display:block; width:100%; padding:6px 9px; border-radius:7px; font-size:12.5px }
  button:hover { background:var(--bg) } button[data-on=true] { background:var(--accent); color:#111 }
  .act { border:1px solid var(--line); text-align:center; margin-top:6px } .act:hover { border-color:var(--accent) }
  input[type=range] { width:110px } input[type=color] { width:26px; height:24px; border:none; background:none }
  .layer { display:flex; gap:6px; align-items:center; padding:4px 6px; border-radius:6px; font-size:12px; cursor:pointer }
  .layer:hover { background:var(--bg) } .layer[data-on=true] { outline:1px solid var(--accent) }
  .layer span:first-child { cursor:pointer } .layer .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  #aibox input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--ink); padding:6px 8px; font-size:12px }
  .note { color:var(--dim); font-size:11px; margin-top:6px; line-height:1.5 }
</style>
</head>
<body>
<header>
  <b>Canvasmith</b><span class="note">vanilla shell on the headless core — every control is a public API call</span>
  <span class="sp"></span>
  <label>Size <input type="range" id="size" min="2" max="220" value="30"></label>
  <label>Opacity <input type="range" id="op" min="0.05" max="1" step="0.05" value="1"></label>
  <input type="color" id="col" value="#d4ff45" title="colour">
  <button class="act" style="width:auto;padding:5px 10px" id="undo">↩</button>
  <button class="act" style="width:auto;padding:5px 10px" id="redo">↪</button>
  <button class="act" style="width:auto;padding:5px 10px" id="png">⬇ PNG</button>
</header>
<main>
  <nav id="tools"></nav>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside>
    <div class="grp">Layers</div><div id="layers"></div>
    <div class="grp">Open</div>
    <button class="act" id="openfile">📁 Open image…</button>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="note">…or just drag &amp; drop / paste an image anywhere on the canvas, or open this page with <code>?image=&lt;url&gt;</code>.</div>
    <div class="grp">AI (free Gemini key)</div>
    <div id="aibox"></div>
  </aside>
</main>

<script type="module">
import { Editor, GeminiProvider, installBridge, installDropImport, PAINT_TOOLS, selectionToPath2D }
  from '../../packages/core/src/index.js';

const ed = new Editor({ fabric: window.fabric, canvasEl: document.getElementById('cv'), width: 960, height: 640 });
window.ed = ed;   // poke at the API from the console

/* ── overlay chrome: dashed selection outline + crop scrim, drawn on fabric's top context ──
   The CORE keeps selection/crop as pure state; making them visible is the shell's job — this is
   the reference implementation other UIs can copy. */
const drawOverlays = () => {
  const ctx = ed.fc.contextTop; if (!ctx) return;
  ed.fc.clearContext(ctx);
  const v = ed.fc.viewportTransform;
  ctx.save(); ctx.transform(v[0], v[1], v[2], v[3], v[4], v[5]);
  if (ed.selection) {
    const p = selectionToPath2D(ed.selection, ed.W, ed.H);
    ctx.lineWidth = 1.6 / v[0];
    ctx.setLineDash([7 / v[0], 5 / v[0]]);
    ctx.strokeStyle = '#d4ff45'; ctx.stroke(p);
    ctx.lineDashOffset = 6 / v[0]; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.stroke(p);
    ctx.setLineDash([]);
  }
  if (ed.crop) {
    const c = ed.crop;
    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.beginPath(); ctx.rect(0, 0, ed.W, ed.H); ctx.rect(c.x, c.y, c.w, c.h); ctx.fill('evenodd');
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4 / v[0]; ctx.strokeRect(c.x, c.y, c.w, c.h);
    // rule-of-thirds guides
    ctx.lineWidth = 0.7 / v[0]; ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    for (let i = 1; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(c.x + c.w * i / 3, c.y); ctx.lineTo(c.x + c.w * i / 3, c.y + c.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(c.x, c.y + c.h * i / 3); ctx.lineTo(c.x + c.w, c.y + c.h * i / 3); ctx.stroke();
    }
    const hs = 5.5 / v[0]; ctx.fillStyle = '#d4ff45';
    for (const [hx, hy] of [[c.x, c.y], [c.x + c.w, c.y], [c.x, c.y + c.h], [c.x + c.w, c.y + c.h],
                            [c.x + c.w / 2, c.y], [c.x + c.w / 2, c.y + c.h], [c.x, c.y + c.h / 2], [c.x + c.w, c.y + c.h / 2]])
      ctx.fillRect(hx - hs, hy - hs, hs * 2, hs * 2);
  }
  ctx.restore();
};
ed.fc.on('after:render', drawOverlays);
ed.on('selection', () => ed.fc.requestRenderAll());
ed.on('crop', () => ed.fc.requestRenderAll());

/* ── toolbar (grouped) ─────────────────────────────────────────────── */
const GROUPS = {
  Move: ['select', 'hand', 'crop'],
  Paint: PAINT_TOOLS,
  Select: ['marquee', 'marquee-ellipse', 'lasso', 'wand'],
  Draw: ['rect', 'ellipse', 'line', 'triangle', 'polygon', 'star', 'type', 'bucket', 'gradient', 'eyedropper'],
};
const nav = document.getElementById('tools');
for (const [g, tools] of Object.entries(GROUPS)) {
  nav.insertAdjacentHTML('beforeend', `<div class="grp">${g}</div>`);
  tools.forEach(t => nav.insertAdjacentHTML('beforeend', `<button data-tool="${t}">${t}</button>`));
}
nav.addEventListener('click', e => { const t = e.target.dataset.tool; if (t) ed.setTool(t); });
ed.on('tool', t => {
  nav.querySelectorAll('button').forEach(b => b.dataset.on = String(b.dataset.tool === t));
  cropBtn(t === 'crop');
});
function cropBtn(on) {
  document.getElementById('applycrop')?.remove();
  if (on) {
    const b = document.createElement('button');
    b.id = 'applycrop'; b.className = 'act'; b.textContent = '✓ Apply crop';
    b.onclick = () => ed.applyCrop();
    nav.prepend(b);
  }
}

/* ── options / history / export ────────────────────────────────────── */
size.oninput = e => ed.setToolOptions({ size: +e.target.value });
op.oninput = e => ed.setToolOptions({ opacity: +e.target.value });
col.oninput = e => ed.setToolOptions({ color: e.target.value, fill: e.target.value });
ed.on('tooloptions', o => { col.value = /^#([0-9a-f]{6})$/i.test(o.color) ? o.color : col.value; });
undo.onclick = () => ed.undo(); redo.onclick = () => ed.redo();
ed.on('history', h => { undo.disabled = h.past < 2; redo.disabled = !h.future; });
png.onclick = () => { const a = document.createElement('a'); a.href = ed.exportPNG(); a.download = 'canvasmith.png'; a.click(); };

/* ── layers panel ──────────────────────────────────────────────────── */
const panel = document.getElementById('layers');
const renderLayers = () => {
  panel.innerHTML = ed.layers().map(l =>
    `<div class="layer" data-id="${l.id}" data-on="${l.active}">
       <span data-act="vis">${l.visible ? '👁' : '—'}</span>
       <span class="nm" style="opacity:${l.visible ? 1 : .4}">${l.name}</span>
       <span data-act="up">↑</span><span data-act="del">✕</span></div>`).join('');
};
panel.addEventListener('click', e => {
  const row = e.target.closest('.layer'); if (!row) return;
  const id = row.dataset.id, act = e.target.dataset.act;
  if (act === 'vis') ed.setLayer(id, { visible: panel.querySelector(`[data-id="${id}"] span`).textContent === '—' });
  else if (act === 'up') ed.moveLayer(id, 'up');
  else if (act === 'del') ed.removeLayer(id);
  else ed.activate(id);
});
ed.on('change', renderLayers); renderLayers();

/* ── open: file picker, drag/drop+paste, and the cross-platform bridge ── */
openfile.onclick = () => file.click();
file.onchange = () => { const f = file.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => ed.openImage(r.result); r.readAsDataURL(f); };
installDropImport(document.getElementById('stage'), src => ed.addImage(src));
installBridge(src => ed.openImage(src));   // ?image= / #img= / postMessage / localStorage handoff

/* ── AI box: free Gemini key flow ──────────────────────────────────── */
const gem = new GeminiProvider();
ed.ai.register(gem);
const aibox = document.getElementById('aibox');
const renderAI = () => {
  if (!gem.hasKey()) {
    aibox.innerHTML = `<div class="note">AI tools run on <b>your own free Gemini key</b> — Google gives
      every account free daily usage, no card. Create one at
      <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent)">aistudio.google.com/apikey</a>
      and paste it:</div><input id="gkey" placeholder="AIza…" style="margin-top:6px">`;
    aibox.querySelector('#gkey').addEventListener('keydown', e => {
      if (e.key === 'Enter') { gem.setKey(e.target.value.trim()); renderAI(); }
    });
  } else {
    aibox.innerHTML = `<input id="gp" placeholder="e.g. make the sky sunset"><button class="act" id="grun">✦ Apply AI edit</button>
      <button class="act" id="gkey2" style="font-size:11px">change key</button><div class="note" id="gmsg"></div>`;
    aibox.querySelector('#grun').onclick = async () => {
      const p = aibox.querySelector('#gp').value.trim(); if (!p) return;
      aibox.querySelector('#gmsg').textContent = 'Working…';
      const r = await ed.aiEdit(p);
      aibox.querySelector('#gmsg').textContent = r.status === 'ok' ? 'Applied ✓ (undo to revert)' : (r.message || r.reason);
    };
    aibox.querySelector('#gkey2').onclick = () => { gem.setKey(null); renderAI(); };
  }
};
renderAI();
</script>
</body>
</html>
